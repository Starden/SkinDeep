# Runs the syntax check and the mock-client test suite on PRs and on pushes
# to main. Branch pushes are covered by their PR, so tests run once, not twice.
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
